# http{} context (for example a file in conf.d/), once per server:
#   limit_conn_zone $binary_remote_addr zone=meshguard_web_conn:1m;
#   limit_req_zone  $binary_remote_addr zone=meshguard_web_req:1m rate=30r/m;
#
# Add the locations inside the existing TLS server. Bun listens only on loopback.
location = /meshguard-web/ws {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # Overwrite, never append: the gateway trusts this header only from this loopback proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    limit_conn meshguard_web_conn 4;
    limit_conn_status 429;
    limit_req zone=meshguard_web_req burst=10 nodelay;
    limit_req_status 429;
    proxy_connect_timeout 3s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
location = /meshguard-web/health {
    proxy_pass http://127.0.0.1:4321;
    limit_req zone=meshguard_web_req burst=10 nodelay;
    proxy_connect_timeout 3s;
}
