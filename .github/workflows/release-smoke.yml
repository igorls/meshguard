# TEMPORARY (release-prep PR only, removed before merge): runs the release
# build matrix on the self-hosted runner with the pinned Zig, without uploading
# or publishing anything.
name: Release build smoke (temporary)

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-smoke.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: [self-hosted, zig]
    strategy:
      matrix:
        include:
          - target: ""
            artifact: meshguard-linux-amd64
            ext: ""
            build_args: ""
          - target: aarch64-linux-gnu
            artifact: meshguard-linux-arm64
            ext: ""
            build_args: "-Dno-sodium=true"
          - target: x86_64-windows
            artifact: meshguard-windows-amd64
            ext: ".exe"
            build_args: ""
            # Embedding library: meshguard-ffi.dll and its import library.
            ffi_artifact: meshguard-ffi-windows-amd64
          - target: x86_64-freebsd
            artifact: meshguard-freebsd-amd64
            ext: ""
            build_args: ""
          - target: x86_64-macos
            artifact: meshguard-macos-amd64
            ext: ""
            build_args: ""
          - target: aarch64-macos
            artifact: meshguard-macos-arm64
            ext: ""
            build_args: ""

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Pin the compiler instead of relying on whatever Zig the self-hosted
      # runner has installed. The Zig cache stays on the runner's disk, so the
      # action's GitHub cache upload is off.
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
          use-cache: false

      - name: Check Zig version
        run: |
          ZIG_VERSION="$(zig version)"
          if [ "$ZIG_VERSION" != "0.17.0" ]; then
            echo "::error::Expected Zig 0.17.0, got $ZIG_VERSION"
            exit 1
          fi
          echo "✓ Zig $ZIG_VERSION"

      - name: Build
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast ${{ matrix.build_args }}
          else
            zig build -Doptimize=ReleaseFast ${{ matrix.build_args }}
          fi

      - name: Rename artifact
        run: mv zig-out/bin/meshguard${{ matrix.ext }} ${{ matrix.artifact }}${{ matrix.ext }}

      - name: Rename FFI library
        if: matrix.ffi_artifact
        run: |
          mv zig-out/bin/meshguard-ffi.dll ${{ matrix.ffi_artifact }}.dll
          mv zig-out/lib/meshguard-ffi.lib ${{ matrix.ffi_artifact }}.lib

      - name: List outputs
        run: ls -la ${{ matrix.artifact }}${{ matrix.ext }} ${{ matrix.ffi_artifact && format('{0}.dll {0}.lib', matrix.ffi_artifact) || '' }}
