name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Build
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Control endpoint and startup regression checks
        run: python scripts/test-control-startup.py zig-out/bin/meshguard${{ runner.os == 'Windows' && '.exe' || '' }}

  test-linux:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Test
        run: zig build test

      - name: Relay forwarding between mobile contexts
        run: |
          zig build -Doptimize=ReleaseSafe
          python3 scripts/test-relay.py zig-out/bin/meshguard zig-out/lib/libmeshguard-ffi.so -v

      - name: Relay load smoke test
        run: |
          zig build relay-loadgen -Doptimize=ReleaseSafe
          python3 bench/relay-load/run.py --clients 300 --rate 1 --duration 5 --warmup 30 --spoofers 2 --max-loss 0.01

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Test (core + FFI)
        run: zig build test

      - name: Build meshguard-ffi.dll
        run: zig build -Doptimize=ReleaseSafe

      - name: FFI library and import library are installed
        shell: bash
        run: test -f zig-out/bin/meshguard-ffi.dll && test -f zig-out/lib/meshguard-ffi.lib

      - name: Relay forwarding and tunnels between contexts loaded from the DLL
        run: python scripts/test-relay.py zig-out/bin/meshguard.exe zig-out/bin/meshguard-ffi.dll -v

  libraries:
    name: Linux, FreeBSD and Android FFI libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      # qemu-user runs 32-bit ARM code: the unit tests (static musl) and the
      # linux-armhf C hosts (with the armhf glibc from libc6-armhf-cross).
      - name: Install qemu-user and the armhf C library
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user libc6-armhf-cross

      # The runner image provides the Android NDK (ANDROID_NDK_HOME).
      - name: Build library packages
        run: ./scripts/build-libraries.sh

      - name: Check exports, dependencies, Android alignment and C hosts
        run: ./scripts/test-libraries.sh

      # Zig has no 64-bit atomics on 32-bit ARM: this runs the locked counter path
      # and every other unit test on a 32-bit target.
      - name: Unit tests on 32-bit ARM (qemu)
        run: zig build test -Dtarget=arm-linux-musleabihf -Dno-sodium=true -fqemu --summary all

      - name: Relay forwarding with the packaged Linux library
        run: |
          zig build -Doptimize=ReleaseFast -Dcrypto-backend=std
          python3 scripts/test-relay.py zig-out/bin/meshguard zig-out/libraries/linux-amd64/lib/libmeshguard-ffi.so -v

  no-sodium-linux:
    name: Build + Test (ubuntu, std.crypto / no libsodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Deliberately do NOT install libsodium-dev — this lane proves the
      # std.crypto path builds and tests on Linux with no libsodium present
      # (regression guard for the optional-libsodium work, meshguard#102).

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0

      - name: Build (std.crypto, no libsodium)
        run: zig build -Dno-sodium=true

      - name: Build ReleaseFast (std.crypto, no libsodium)
        run: zig build -Dno-sodium=true -Doptimize=ReleaseFast

      - name: Test (std.crypto, no libsodium)
        run: zig build test -Dno-sodium=true

  apple:
    name: Apple FFI build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.18.0-dev.253+16d31ceed

      - name: Unit and FFI tests (std.crypto)
        run: zig build test -Dcrypto-backend=std

      - name: Build Apple libraries and XCFramework
        run: ./scripts/build-apple.sh

      - name: Test Apple consumer linking
        run: ./scripts/test-apple-link.sh

      - name: Relay forwarding with Apple FFI
        run: |
          zig build -Doptimize=ReleaseFast -Dcrypto-backend=std
          python3 scripts/test-relay.py zig-out/bin/meshguard zig-out/apple/macos-universal/lib/libmeshguard-ffi.dylib -v
