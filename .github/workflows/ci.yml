name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Control endpoint and startup regression checks
        run: python scripts/test-control-startup.py zig-out/bin/meshguard${{ runner.os == 'Windows' && '.exe' || '' }}

  test-linux:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test

      - name: Relay forwarding between mobile contexts
        run: |
          zig build -Doptimize=ReleaseSafe
          python3 scripts/test-relay.py zig-out/bin/meshguard zig-out/lib/libmeshguard-ffi.so -v

      - name: Relay load smoke test
        run: |
          zig build relay-loadgen -Doptimize=ReleaseSafe
          python3 bench/relay-load/run.py --clients 300 --rate 1 --duration 5 --warmup 30 --spoofers 2 --max-loss 0.01

  test-windows:
    name: Test (windows)
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test (core + FFI)
        run: zig build test

      - name: Build meshguard-ffi.dll
        run: zig build -Doptimize=ReleaseSafe

      - name: FFI library and import library are installed
        shell: bash
        run: test -f zig-out/bin/meshguard-ffi.dll && test -f zig-out/lib/meshguard-ffi.lib

      - name: Relay forwarding and tunnels between contexts loaded from the DLL
        run: python scripts/test-relay.py zig-out/bin/meshguard.exe zig-out/bin/meshguard-ffi.dll -v

  no-sodium-linux:
    name: Build + Test (ubuntu, std.crypto / no libsodium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately do NOT install libsodium-dev — this lane proves the
      # std.crypto path builds and tests on Linux with no libsodium present
      # (regression guard for the optional-libsodium work, meshguard#102).

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (std.crypto, no libsodium)
        run: zig build -Dno-sodium=true

      - name: Build ReleaseFast (std.crypto, no libsodium)
        run: zig build -Dno-sodium=true -Doptimize=ReleaseFast

      - name: Test (std.crypto, no libsodium)
        run: zig build test -Dno-sodium=true
