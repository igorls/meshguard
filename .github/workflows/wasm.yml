name: WASM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    name: Portable core and native packet interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Build WASM and exercise the ABI
        run: zig build wasm wasm-test -Doptimize=ReleaseSmall
      - name: Build native FFI without libsodium
        run: zig build -Dcrypto-backend=std -Doptimize=ReleaseSafe
      - name: Verify authenticated browser gateway, passes and relay delivery
        env:
          MESHGUARD_BINARY: ${{ github.workspace }}/zig-out/bin/meshguard
        run: bun test tests/web
      - name: Browser sessions through the gateway to an opaque relay
        run: bun bench/relay-load/browser.mjs --binary zig-out/bin/meshguard --sessions 64 --rate 1 --duration 5 --opaque --max-loss 0.01
      - name: Exchange packets between WASM and native FFI over UDP
        env:
          MESHGUARD_NATIVE_LIBRARY: ${{ github.workspace }}/zig-out/lib/libmeshguard-ffi.so
        run: node tests/wasm/native-interop.mjs
      # The same tests, against the packed release packages instead of the source tree.
      - name: Build, pack and test the browser packages
        env:
          MESHGUARD_BINARY: ${{ github.workspace }}/zig-out/bin/meshguard
          MESHGUARD_NATIVE_LIBRARY: ${{ github.workspace }}/zig-out/lib/libmeshguard-ffi.so
        run: ./scripts/build-web.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meshguard-wasm
          path: |
            zig-out/bin/meshguard.wasm
            web/meshguard.mjs
            web/relay-protocol.mjs
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meshguard-web-packages
          path: |
            zig-out/web/meshguard-web-*.tgz
            zig-out/web/meshguard-gateway-*.tgz
          if-no-files-found: error
